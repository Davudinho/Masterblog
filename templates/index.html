<!DOCTYPE html>
<html>
<head>
    <title>Masterblog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>My Blog</h1>

{% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p><i>by {{ post.author }}</i></p>
        <p>{{ post.content }}</p>
        <hr>
    </div>
{% else %}
    <p>No posts available.</p>
{% endfor %}

</body>
</html>
